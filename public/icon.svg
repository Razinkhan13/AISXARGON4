<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Clip circle to seamlessly remove any white corners from the uploaded square -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="240" />
    </clipPath>

    <!-- Neon Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Outer Background -->
  <rect width="512" height="512" rx="118" fill="#04070e" />

  <!-- Outer Cyan Accent Ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="240" fill="#0e1626" />

  <!-- Embedded Authentic High-Res Master Image Clipped To Circle -->
  <g clip-path="url(#circleClip)">
    <image href="data:image/jpeg;base64," x="-16" y="-16" width="544" height="544" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- Specular Protective Outer Ring Highlight -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6" filter="url(#cyanGlow)" />
</svg>