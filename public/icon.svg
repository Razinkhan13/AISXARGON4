<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1a2e" />
      <stop offset="100%" stop-color="#04070e" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dbe9" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="neonRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b89" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00dbe9" stroke-opacity="0.3" stroke-width="4" />

  <!-- Outer Cyber Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonCyan)" stroke-width="6" stroke-dasharray="16 8" filter="url(#glow)" />

  <!-- Diamond Shield Monogram -->
  <polygon points="256,96 416,256 256,416 96,256" fill="#070d18" stroke="url(#neonRose)" stroke-width="8" filter="url(#glow)" />
  <polygon points="256,128 384,256 256,384 128,256" fill="none" stroke="#00dbe9" stroke-opacity="0.5" stroke-width="3" />

  <!-- Center Core AIS Monogram -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="78" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">AIS</text>
  <text x="256" y="320" font-family="monospace" font-size="16" font-weight="700" fill="#00dbe9" text-anchor="middle" letter-spacing="6">CAPITAL</text>
</svg>
